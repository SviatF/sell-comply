name: Regulatory Monitor

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Run SellComply monitoring
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_URL" ] || [ -z "$MONITOR_SECRET" ]; then
            echo "Monitoring secrets are not configured yet; skipping safely."
            exit 0
          fi

          curl --fail --silent --show-error             -X POST             -H "x-monitor-token: $MONITOR_SECRET"             "$MONITOR_URL"
